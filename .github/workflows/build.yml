name: Build Production Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with Debug Key (For Direct Installation)
        run: |
          sudo apt-get update && sudo apt-get install -y android-sdk-platform-tools apksigner
          # إنشاء مفتاح توقيع افتراضي وتوقيع الملف
          keytool -genkey -v -keystore release.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/NOVA-Chat-Final.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed Production APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Chat-Final-APK
          path: app/build/outputs/apk/release/NOVA-Chat-Final.apk
